name: doz
description: Doz wearable prototype companion with BLE telemetry, local history, and an optional assistant.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_blue_plus: ^1.35.5
  http: ^1.2.2
  provider: ^6.1.2
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.4
  intl: ^0.20.2
  permission_handler: ^11.3.1
  geolocator: ^14.0.3
  flutter_local_notifications: ^22.0.1
  url_launcher: ^6.3.1
  supabase_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
